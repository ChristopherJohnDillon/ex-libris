[project]
name = "ex-libris"
description = "A friendly catalogue for the books you own."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "httpx>=0.27",
  "pillow>=10.4",
  "python-multipart>=0.0.9",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.dynamic]
version = { attr = "exlibris.__version__" }

[tool.setuptools.packages.find]
include = ["exlibris*"]

[tool.setuptools.package-data]
exlibris = ["web/templates/**/*", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
